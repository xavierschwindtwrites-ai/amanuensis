<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' file: blob:; connect-src 'none'">
  <title>Amanuensis</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="drag"></div>

  <!-- LIBRARY -->
  <section id="library" class="view">
    <header class="lib-head">
      <div class="wordmark">Amanuensis</div>
      <button id="lib-settings" class="link quiet">Settings</button>
    </header>
    <div class="lib-inner">
      <div id="books" class="shelf"></div>
      <p id="lib-hint" class="hint"></p>
    </div>
  </section>

  <!-- EDITOR -->
  <section id="editor" class="view" hidden>
    <button id="back" class="chrome corner" title="Library (⇧⌘L)">Library</button>

    <nav id="nav" class="chrome">
      <div class="nav-head"><span id="nav-book"></span></div>
      <ol id="chapters"></ol>
      <button id="add-chapter" class="link quiet">+ New chapter</button>
    </nav>
    <div id="nav-hot"></div>

    <main id="scroller">
      <article id="page">
        <div id="ch-num"></div>
        <h1 id="ch-title" contenteditable="plaintext-only" spellcheck="false" data-placeholder="Untitled"></h1>
        <div id="text" contenteditable="true" spellcheck="false"></div>
      </article>
    </main>

    <footer id="bar" class="chrome">
      <div class="bar-left">
        <span id="wc-chapter"></span>
        <span id="wc-book" class="dim"></span>
        <span id="wc-session" class="dim"></span>
        <button id="sprint" class="link quiet" hidden title="Sprint (⌥⌘S to start or finish)"></button>
      </div>
      <div class="bar-mid">
        <button id="rec" title="Record (⌘D)" aria-label="Record"><span class="dot"></span></button>
        <div id="rec-info"><span id="rec-time">0:00</span><span id="meter"><i></i></span></div>
      </div>
      <div class="bar-right">
        <span id="status" class="dim"></span>
        <button id="level-btn" class="link quiet" title="Cleanup level (⌥⌘0–3)"></button>
 <button id="sprint-btn" class="link quiet" hidden title="Start a sprint (⌥⌘S)">Sprint</button>
        <button id="note-btn" class="link quiet" title="Leave a note for next time (⌘J)">Note</button>
        <button id="transcript-btn" class="link quiet" title="Transcript (⇧⌘T)">Transcript</button>
        <button id="settings-btn" class="link quiet" title="Settings (⌘,)">Settings</button>
      </div>
    </footer>

    <aside id="drawer" hidden>
      <div class="drawer-head">
        <span>Transcript</span>
        <button id="drawer-close" class="link quiet">Close</button>
      </div>
      <p class="drawer-note">Everything you said, exactly as transcribed. Switch any passage between versions; nothing here is ever deleted.</p>
      <ol id="segments"></ol>
    </aside>

    <div id="breadcrumb" class="chrome" hidden>
      <span class="bc-where"></span><span class="bc-text"></span>
      <span class="bc-acts"><button data-bc="edit">Edit</button><button data-bc="done">Done</button><button data-bc="delete">Delete</button></span>
    </div>
    <div id="today" class="chrome" hidden></div>
    <div id="ex-after" hidden></div>
    <div id="crumb-edit" hidden>
      <input id="crumb-input" placeholder="What happens next?" spellcheck="false" autocomplete="off">
      <span class="dim">Enter to save · Esc to cancel</span>
    </div>

    <div id="find" hidden>
      <input id="find-q" placeholder="Find" spellcheck="false">
      <span id="find-n" class="dim"></span>
    </div>
  </section>

  <div id="modal" hidden><div id="modal-box"></div></div>
  <div id="toast" hidden></div>
  <div id="ack" hidden></div>
  <audio id="player" hidden></audio>

  <script src="covers.js"></script>
  <script src="../lib/format.js"></script>
  <script src="../lib/habits.js"></script>
  <script src="../lib/mastery.js"></script>
  <script src="../lib/apprentice.js"></script>
  <script src="app.js"></script>
  <script src="mastery.js"></script>
  <script src="apprentice.js"></script>
</body>
</html>
